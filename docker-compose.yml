version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cricrs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cricrs
      POSTGRES_PASSWORD: cricrs_secret
      POSTGRES_DB: cricrs_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cricrs']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cricrs_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cricrs:cricrs_secret@postgres:5432/cricrs_db
      JWT_SECRET: supersecretjwtkey_change_in_production
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: http://localhost
    ports:
      - '4000:4000'
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cricrs_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'

volumes:
  pgdata:
